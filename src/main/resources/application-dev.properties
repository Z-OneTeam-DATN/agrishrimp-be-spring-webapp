# ==================================================
# APPLICATION CONFIG - DEV ENVIRONMENT
# --------------------------------------------------
# Moi truong: Development (local)
# Database chay bang Docker MySQL
#
# Luu y cho team:
# - Khong commit mat khau production vao file nay
# - Moi thay doi DB phai thong qua Flyway
# Cu phap: ${TEN_BIEN_TRONG_DOCKER: GIA_TRI_MAC_DINH_LOCAL}

# ==============================================================

# 1. URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:14331/DB_ShrimpDATN?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}

# 2. TAI KHOAN
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234567}

# 3. DRIVER
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY CONFIGURATION
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# B?t t?t captcha (true = b?t, false = t?t)
recaptcha.enabled=false