server:
  port: ${SERVER_PORT:8004}

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

spring:
  application:
    name: agri-shrimp

  # 1. CẤU HÌNH DATABASE (MYSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/agri_shrimp_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:agri_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_local_mysql_user_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. CẤU HÌNH JPA
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # 3. CẤU HÌNH REDIS
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  # 4. CẤU HÌNH MAIN
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 8. CẤU HÌNH MAIL SERVER
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

# 5. CẤU HÌNH JWT
security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:dev-only-change-me}
    issuer: ${SECURITY_JWT_ISSUER:agri-shrimp}
    expiry-time-in-seconds: ${SECURITY_JWT_EXPIRY_SECONDS:3600} # 1 giờ
    refreshable-duration: ${SECURITY_JWT_REFRESHABLE_DURATION_SECONDS:604800} # 7 ngày

# 6. CẤU HÌNH APP (CORS)
app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:3004,http://localhost:8004,https://*.mini.123c.vn,https://mini.123c.vn,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://h5.zdn.vn,https://*.zdn.vn}"
  turnstile:
    secret-key: "${APP_TURNSTILE_SECRET_KEY:}"
    url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"
  google:
    client-id: "${APP_GOOGLE_CLIENT_ID:}"
  cookie:
    secure: ${APP_COOKIE_SECURE:false}     # true khi deploy HTTPS
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
  web-base-url: "${APP_WEB_BASE_URL:http://localhost:3004}"
  server:
    url: "${APP_SERVER_URL:http://localhost:8004}"

# AI SERVICE (dùng cho Mini App diagnosis)
ai:
  base-url: http://localhost:8000
  predict-path: /ai/predict-image
  prescription-path: /ai/generate-prescription

# ZALO MINI APP
zalo:
  app-secret: "${ZALO_APP_SECRET:}"

# 7. CẤU HÌNH AWS
cloud:
  aws:
    accessKey: "${AWS_ACCESS_KEY_ID:}"
    secretKey: "${AWS_SECRET_ACCESS_KEY:}"
    region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:agri-shrimp-storage}
    upload-dir: ${AWS_S3_UPLOAD_DIR:webapp}
    region: ${AWS_REGION:ap-southeast-1}

# 9. CẤU HÌNH CLOUDINARY
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:agrishrimp/products}

# 10. GEOCODING (TrackAsia hoặc Nominatim)
geocoding:
  provider: ${GEOCODING_PROVIDER:trackasia}          # trackasia | nominatim
  trackasia:
    api-key: ${TRACKASIA_API_KEY:}
    url: https://api.trackasia.vn/api/geocode/search
    autocomplete-url: ${TRACKASIA_AUTOCOMPLETE_URL:https://api.trackasia.vn/api/geocode/autocomplete}
  nominatim:
    url: https://nominatim.openstreetmap.org/search

# 11. DISTANCE MATRIX / ROUTING (OpenRouteService)
routing:
  provider: ${ROUTING_PROVIDER:ors}                # ors | trackasia
  ors:
    api-key: "${ORS_API_KEY:}"
    url: https://api.openrouteservice.org/v2/matrix/driving-car
  trackasia:
    api-key: ${TRACKASIA_ROUTING_KEY:}

# 12. SHIPPING (GHN)
shipping:
  provider: ${SHIPPING_PROVIDER:ghn}                # ghn | ghtk
  ghn:
    token: ${GHN_API_KEY:}
    shop-id: ${GHN_SHOP_ID:}
    url: https://online-gateway.ghn.vn/shiip/public-api/v2

# 13. LOCATION / SEARCH CONFIG
location:
  default-radius-km: ${LOCATION_DEFAULT_RADIUS_KM:15}
  max-candidates: ${LOCATION_MAX_CANDIDATES:5}
  ip-geo-url: ${LOCATION_IP_GEO_URL:http://ip-api.com/json}

# 15. IMAGE SEARCH AI SERVICE (Python)
image-search:
  base-url: ${IMAGE_SEARCH_URL:http://localhost:5001}

# 14. PAYOS PAYMENT GATEWAY
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: "${PAYOS_RETURN_URL:http://localhost:3004/order-success}"
  cancel-url: "${PAYOS_CANCEL_URL:http://localhost:3004/order-cancel}"

# 16. CẤU HÌNH OCR (GOOGLE VISION)
ocr:
  tesseract:
    language: ${OCR_TESSERACT_LANGUAGE:vie}
    data-path: ${OCR_TESSERACT_DATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
  max-file-size-bytes: ${OCR_MAX_FILE_SIZE_BYTES:5242880}
  max-image-width: ${OCR_MAX_IMAGE_WIDTH:1800}

# 17. WEB PUSH (VAPID)
vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:admin@agrishrimp.vn}
