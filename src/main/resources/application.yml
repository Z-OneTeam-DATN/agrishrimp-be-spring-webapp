spring:
  application:
    name: agri-shrimp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  
# OCR Configuration
ocr:
  tesseract:
    language: ${OCR_TESSERACT_LANGUAGE:vie}
    data-path: ${OCR_TESSERACT_DATA_PATH:}
  max-file-size-bytes: ${OCR_MAX_FILE_SIZE_BYTES:5242880}
  max-image-width: ${OCR_MAX_IMAGE_WIDTH:1800}
