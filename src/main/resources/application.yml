spring:
  application:
    name: agri-shrimp
  config:
    import: optional:file:.env[.properties],optional:file:.env.local[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  
# Transfer Replenishment Aggregation Configuration
transfer:
  aggregation:
    # Cửa sổ gom đơn: thời gian (phút) chờ trước khi tạo phiếu điều chuyển.
    # Các đơn hàng thiếu hàng trong cùng cửa sổ + cùng tuyến sẽ được gom vào 1 phiếu.
    window-minutes: ${TRANSFER_AGGREGATION_WINDOW_MINUTES:60}
    # Cửa sổ merge: nếu đã có phiếu điều chuyển PENDING cùng tuyến tạo trong N giờ qua
    # thì gộp hàng vào phiếu đó thay vì tạo mới (tránh nhiều phiếu trùng tuyến nhiều ngày).
    merge-open-hours: ${TRANSFER_MERGE_OPEN_HOURS:24}

# OCR Configuration
ocr:
  tesseract:
    language: ${OCR_TESSERACT_LANGUAGE:vie}
    data-path: ${OCR_TESSERACT_DATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
  max-file-size-bytes: ${OCR_MAX_FILE_SIZE_BYTES:5242880}
  max-image-width: ${OCR_MAX_IMAGE_WIDTH:1800}

# VietQR API Configuration
vietqr:
  client-id: ${VIETQR_CLIENT_ID:}
  api-key: ${VIETQR_API_KEY:}
