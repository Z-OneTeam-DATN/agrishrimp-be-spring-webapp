server:
  port: 8080
  error:
    include-stacktrace: never

spring:
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/agri_shrimp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456zoneteam}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    issuer: ${SECURITY_JWT_ISSUER:agri-shrimp}
    expiry-time-in-seconds: 86400
    refreshable-duration: 604800

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  turnstile:
    secret-key: ${APP_TURNSTILE_SECRET_KEY:0x4AAAAAACWEfgMhY3lG-CqER4Ayl1OtWOY}
    url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID:716238456770-avu71bkjh5nngpq1j5gs7euull9kn663.apps.googleusercontent.com}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: agrishrimp/products

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:http://localhost:3000/order-success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/order-cancel}

geocoding:
  provider: trackasia
  trackasia:
    api-key: ${TRACKASIA_API_KEY:63a1ec0fafba9b6c88391772034153b56c}
    url: https://api.trackasia.vn/api/geocode/search
  nominatim:
    url: https://nominatim.openstreetmap.org/search

routing:
  provider: ors
  ors:
    api-key: ${ORS_API_KEY:eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjQ0OGZjMDBmNjdjZjQwNTliMzcxNjYwMDgwNjU5ODk0IiwiaCI6Im11cm11cjY0In0=}
    url: https://api.openrouteservice.org/v2/matrix/driving-car
  trackasia:
    api-key: ${TRACKASIA_ROUTING_KEY:63a1ec0fafba9b6c88391772034153b56c}

shipping:
  provider: ghn
  ghn:
    token: ${GHN_TOKEN:0c84d3ad-125f-11f1-8935-9e298af4d523}
    shop-id: ${GHN_SHOP_ID:6287754}
    url: https://online-gateway.ghn.vn/shiip/public-api/v2

location:
  default-radius-km: 15
  max-candidates: 5
  ip-geo-url: http://ip-api.com/json

image-search:
  base-url: ${IMAGE_SEARCH_URL:http://localhost:5001}

cloud:
  aws:
    accessKey: ${AWS_ACCESS_KEY_ID:}
    secretKey: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket-name: agri-shrimp-storage
    upload-dir: webapp
    region: ${AWS_REGION:ap-southeast-1}

logging:
  level:
    root: INFO
    com.zone.agri: INFO
