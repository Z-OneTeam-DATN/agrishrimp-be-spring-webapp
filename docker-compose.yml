services:
  db:
    image: mysql:8.0
    container_name: agri-shrimp-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_local_mysql_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agri_shrimp_db}
      MYSQL_USER: ${MYSQL_USER:-agri_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_local_mysql_user_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: agri-shrimp-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  #  PYTHON AI — DIAGNOSIS (YOLOv8 + Gemini)
  # ─────────────────────────────────────────────
  ai-diagnosis:
    build:
      context: ../agrishrimp-ai-diagnosis
      dockerfile: Dockerfile
    container_name: agri-shrimp-ai-diagnosis
    restart: always
    env_file:
      - ../agrishrimp-ai-diagnosis/.env
    environment:
      PORT: 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────
  #  PYTHON AI — IMAGE SEARCH
  # ─────────────────────────────────────────────
  ai-visual-search:
    build:
      context: ../agrishrimp-ai-visual-search
      dockerfile: Dockerfile
    container_name: agri-shrimp-ai-visual-search
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-agri_shrimp_db}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_local_mysql_password}
      FLASK_PORT: 5001
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.60}
      TOP_K_RESULTS: ${TOP_K_RESULTS:-5}
    volumes:
      # Cache CLIP model (~300MB) — tránh download lại mỗi lần restart
      - clip_model_cache:/root/.cache/clip
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri-shrimp-app
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8004}:8004"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8004}
      # Database connection for container network
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-agri_shrimp_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_local_mysql_password}
      # Redis connection for container network
      SPRING_DATA_REDIS_HOST: redis
      # Security & SDKs (passed via env)
      SECURITY_JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY:-dev-only-change-me}
      SECURITY_JWT_ISSUER: ${SECURITY_JWT_ISSUER:-agri-shrimp}
      APP_TURNSTILE_SECRET_KEY: ${APP_TURNSTILE_SECRET_KEY:-}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:3004/order-success}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:3004/order-cancel}
      # CORS & Cookie
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3004}
      APP_WEB_BASE_URL: ${APP_WEB_BASE_URL:-http://localhost:3004}
      APP_SERVER_URL: ${APP_SERVER_URL:-http://localhost:8004}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Lax}
      # Hibernate (validate = chỉ kiểm tra schema, không tự ALTER; update = tự ALTER khi có thay đổi entity)
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      # Python AI Service
      IMAGE_SEARCH_URL: http://ai-visual-search:5001
      AI_BASE_URL: http://ai-diagnosis:8000
      # Geocoding / Routing
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-trackasia}
      TRACKASIA_API_KEY: ${TRACKASIA_API_KEY}
      TRACKASIA_AUTOCOMPLETE_URL: ${TRACKASIA_AUTOCOMPLETE_URL:-https://api.trackasia.vn/api/geocode/autocomplete}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-ors}
      ORS_API_KEY: ${ORS_API_KEY}
      TRACKASIA_ROUTING_KEY: ${TRACKASIA_ROUTING_KEY:-}
      # Shipping (GHN)
      SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-ghn}
      GHN_API_KEY: ${GHN_API_KEY}
      GHN_SHOP_ID: ${GHN_SHOP_ID:-}
      # OCR/Google Vision
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}

volumes:
  mysql_data:
    external: true
    name: agrishrimp_mysql_data
  clip_model_cache:
