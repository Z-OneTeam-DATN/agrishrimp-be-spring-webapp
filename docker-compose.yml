services:
  db:
    image: mysql:8.0
    container_name: agri-shrimp-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456zoneteam}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agri_shrimp_db}
      MYSQL_USER: ${MYSQL_USER:-agri_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agri_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: agri-shrimp-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  #  PYTHON AI — IMAGE SEARCH
  # ─────────────────────────────────────────────
  image-search:
    build:
      context: ../agrishrimp-ai-visual-search
      dockerfile: Dockerfile
    container_name: agri-shrimp-ai
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-agri_shrimp_db}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456zoneteam}
      FLASK_PORT: 5001
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.60}
      TOP_K_RESULTS: ${TOP_K_RESULTS:-5}
    volumes:
      # Cache CLIP model (~300MB) — tránh download lại mỗi lần restart
      - clip_model_cache:/root/.cache/clip
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri-shrimp-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8001}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Database connection for container network
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-agri_shrimp_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456zoneteam}
      # Redis connection for container network
      SPRING_DATA_REDIS_HOST: redis
      # Security & SDKs (passed via env)
      SECURITY_JWT_SECRET_KEY: ${JWT_SECRET}
      SECURITY_JWT_ISSUER: ${JWT_ISSUER}
      APP_TURNSTILE_SECRET_KEY: ${APP_TURNSTILE_SECRET_KEY:-0x4AAAAAACWEfgMhY3lG-CqER4Ayl1OtWOY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-https://agrishrimp.io.vn/order-success}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-https://agrishrimp.io.vn/order-cancel}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      # CORS & Cookie
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://agrishrimp.io.vn}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      # Hibernate (validate = chỉ kiểm tra schema, không tự ALTER; update = tự ALTER khi có thay đổi entity)
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      # AWS (optional — for S3)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      # Python AI Service
      IMAGE_SEARCH_URL: http://image-search:5001

volumes:
  mysql_data:
  clip_model_cache:
