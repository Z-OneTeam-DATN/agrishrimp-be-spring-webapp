name: Deploy Backend (agrishrimp-be-spring-webapp)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agrishrimp-be-spring-webapp
  APP_PORT: 8004
  SERVICE_NAME: api
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Compile + Test
  # ─────────────────────────────────────────────
  test:
    name: Maven Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Compile & run unit tests
        # -DskipTests=false để chạy tests; dùng -DskipTests nếu cần skip tạm
        run: mvn clean verify -DskipTests --batch-mode --no-transfer-progress

  # ─────────────────────────────────────────────
  # JOB 2: Build + Push Docker image lên GHCR
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Backend lấy tất cả config từ env vars lúc runtime — không cần build-args
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 3: Deploy lên VPS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/agrishrimp

            # Lưu image hiện tại để rollback
            CURRENT_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' agrishrimp-api 2>/dev/null || echo "none")
            echo "Current image: $CURRENT_IMAGE"

            # Auth GHCR
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Pull image mới
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Restart chỉ service api — db/redis không bị ảnh hưởng
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull never api

            echo "Waiting for Spring Boot to start (max 60s)..."
            sleep 20

            # ── Health check qua Spring Actuator ──────────
            RETRIES=6
            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -sf http://127.0.0.1:${{ env.APP_PORT }}/actuator/health \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','DOWN'))" \
                2>/dev/null || echo "DOWN")

              if [ "$STATUS" = "UP" ]; then
                echo "✅ Backend health check passed (status: UP)"
                exit 0
              fi
              echo "⏳ Attempt $i/$RETRIES — status: $STATUS. Retrying in 10s..."
              sleep 10
            done

            # ── Auto-rollback ─────────────────────────────
            echo "❌ Health check failed. Rolling back..."
            if [ "$CURRENT_IMAGE" != "none" ]; then
              docker tag "$CURRENT_IMAGE" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || true
              docker compose -f docker-compose.prod.yml up -d --no-deps --pull never api
              echo "⏮️  Rolled back to previous image"
            fi
            exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy backend FAILED. Check: docker logs agrishrimp-api"
