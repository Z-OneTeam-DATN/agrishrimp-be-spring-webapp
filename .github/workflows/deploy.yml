name: Deploy Backend (agrishrimp-be-spring-webapp)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-agrishrimp
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: z-oneteam-datn/agrishrimp-be-spring-webapp
  APP_PORT: 8004
  JAVA_VERSION: '25'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Compile + Test (GitHub-hosted cloud)
  # ─────────────────────────────────────────────
  test:
    name: Maven Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn clean verify -DskipTests --batch-mode --no-transfer-progress

  # ─────────────────────────────────────────────
  # JOB 2: Build + Push image (GitHub-hosted cloud)
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Pull BuildKit image
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 3: Deploy (self-hosted runner trên máy)
  # Không cần SSH — runner chạy trực tiếp trên server
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy on Server
    runs-on: [self-hosted, linux, agrishrimp]
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull & restart api
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -e
          cd /home/bnhien40/agrishrimp

          CURRENT_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' agrishrimp-api 2>/dev/null || echo "none")

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker pull "$IMAGE:latest"

          recreate_api() {
            if docker compose -f docker-compose.prod.yml up -d --no-deps --pull never api; then
              return 0
            fi

            echo "API recreate failed. Cleaning stale api container and retrying once..."
            docker compose -f docker-compose.prod.yml rm -sf api 2>/dev/null || true
            API_CONTAINER_ID=$(docker ps -aq --filter "name=^/agrishrimp-api$" | head -n 1)
            if [ -n "$API_CONTAINER_ID" ]; then
              docker rm -f "$API_CONTAINER_ID" 2>/dev/null || true
            fi
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull never api
          }

          echo "Ensuring required compose dependencies and network are up..."
          if ! docker compose -f docker-compose.prod.yml up -d db redis; then
            echo "Dependency bootstrap failed. Cleaning stale dependency containers and retrying once..."
            docker rm -f agrishrimp-db agrishrimp-redis 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d db redis
          fi

          echo "Waiting for MySQL container DNS/health..."
          DB_RETRIES=18
          for i in $(seq 1 $DB_RETRIES); do
            DB_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' agrishrimp-db 2>/dev/null || echo "missing")
            if [ "$DB_STATUS" = "healthy" ] || [ "$DB_STATUS" = "running" ]; then
              echo "MySQL container is $DB_STATUS"
              break
            fi
            if [ "$i" = "$DB_RETRIES" ]; then
              echo "❌ MySQL container is not ready: $DB_STATUS"
              docker logs --tail 200 agrishrimp-db || true
              exit 1
            fi
            echo "⏳ DB $i/$DB_RETRIES — $DB_STATUS. Retry in 10s..."
            sleep 10
          done

          recreate_api

          echo "Waiting for Spring Boot..."
          sleep 20

          RETRIES=18
          for i in $(seq 1 $RETRIES); do
            STATUS=$(curl -sf http://127.0.0.1:${{ env.APP_PORT }}/actuator/health \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','DOWN'))" \
              2>/dev/null || echo "DOWN")

            if [ "$STATUS" = "UP" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ $i/$RETRIES — $STATUS. Retry in 10s..."
            sleep 10
          done

          echo "❌ Health check failed. Dumping api logs before rollback..."
          docker logs --tail 200 agrishrimp-api || true

          echo "❌ Rolling back..."
          if [ "$CURRENT_IMAGE" != "none" ]; then
            docker tag "$CURRENT_IMAGE" "$IMAGE:latest" 2>/dev/null || true
            recreate_api
            echo "⏮️  Rolled back"
          fi
          exit 1
