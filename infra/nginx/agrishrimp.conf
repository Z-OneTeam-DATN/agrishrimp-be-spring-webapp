# =============================================================
# Nginx config cho AgriShrimp
# Vị trí: /etc/nginx/sites-available/agrishrimp
# Symlink: ln -s /etc/nginx/sites-available/agrishrimp /etc/nginx/sites-enabled/
#
# SSL: certbot --nginx -d agrishrimp.io.vn -d api.agrishrimp.io.vn
# =============================================================

# ── agrishrimp.io.vn → Frontend (Next.js port 3004) ──────────
server {
    listen 80;
    server_name agrishrimp.io.vn www.agrishrimp.io.vn;

    # Ensure UTF-8 is advertised for text responses to avoid mojibake Vietnamese.
    charset utf-8;
    charset_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml;

    # Certbot sẽ tự thêm redirect HTTPS vào đây
    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js HMR & STOMP)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        # Buffer tuning cho SSR pages
        proxy_buffering     on;
        proxy_buffer_size   16k;
        proxy_buffers       8 16k;
    }

    # Static assets — cache dài hơn
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3004;
        proxy_cache_valid  200 7d;
        add_header         Cache-Control "public, max-age=604800, immutable";
    }
}

# ── api.agrishrimp.io.vn → Backend (Spring Boot port 8004) ────
server {
    listen 80;
    server_name api.agrishrimp.io.vn;

    # Keep API text/json responses consistently UTF-8 encoded.
    charset utf-8;
    charset_types text/plain application/json application/xml;

    # Certbot sẽ tự thêm redirect HTTPS vào đây

    location / {
        proxy_pass         http://127.0.0.1:8004;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket cho STOMP/SockJS
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout  120s;    # Spring Boot khởi động chậm
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Upload file (Cloudinary pre-upload)
        client_max_body_size 55M;
    }

    # Swagger UI (không cache để luôn fresh)
    location /swagger-ui/ {
        proxy_pass         http://127.0.0.1:8004;
        proxy_set_header   Host $host;
        add_header         Cache-Control "no-cache";
    }
}

# ── ai-visual-search: KHÔNG có public domain ─────────────────
# Port 5001 chỉ truy cập nội bộ qua Docker network
# Spring Boot → http://ai-visual-search:5001 (service name)
