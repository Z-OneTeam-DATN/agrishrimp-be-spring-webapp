# =============================================================
# docker-compose.prod.yml — VPS Production Stack
# Vị trí trên VPS: <repo>/infra/docker-compose.prod.yml
#
# Services trong scope:
#   ✅ webapp        (agrishrimp-web,    port 3004)
#   ✅ api           (agrishrimp-be,     port 8004)
#   ✅ ai-visual-search (internal,       port 5001)
#   ✅ db            (MySQL 8)
#   ✅ redis         (Redis 7)
#
# Excluded (NOT deployed):
#   ❌ minizalo      — pending Zalo platform approval
#   ✅ ai-diagnosis  (agrishrimp-ai-diagnosis, internal port 8000)
# =============================================================

services:

  # ─────────────────────────────────────────────────────
  # DATABASE — MySQL 8
  # ─────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: agrishrimp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agri_shrimp_db}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - agrishrimp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────
  # CACHE — Redis 7
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agrishrimp-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - agrishrimp-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────
  # AI VISUAL SEARCH — Flask + CLIP (INTERNAL ONLY)
  # Port 5001 — không expose ra ngoài, chỉ api gọi nội bộ
  # ─────────────────────────────────────────────────────
  ai-visual-search:
    image: ghcr.io/z-oneteam-datn/agrishrimp-ai-visual-search:latest
    container_name: agrishrimp-ai-visual-search
    restart: unless-stopped
    # Không bind port ra host — chỉ truy cập nội bộ qua Docker network
    expose:
      - "5001"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-agri_shrimp_db}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      FLASK_PORT: 5001
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.60}
      TOP_K_RESULTS: ${TOP_K_RESULTS:-5}
    volumes:
      # Cache CLIP model (~340MB) — tránh download lại khi restart
      - clip_model_cache:/root/.cache/clip
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agrishrimp-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s    # CLIP model cần ~60-90s để load lần đầu

  # ─────────────────────────────────────────────────────
  # BACKEND — Spring Boot 3 / Java 21
  # Port 8004 — expose ra host, Nginx proxy từ api.agrishrimp.io.vn
  # ─────────────────────────────────────────────────────
  api:
    image: ghcr.io/z-oneteam-datn/agrishrimp-be-spring-webapp:latest
    container_name: agrishrimp-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"    # bind localhost only — Nginx sẽ proxy
    env_file:
      - ../.env                  # file secrets đặt ở root repo, KHÔNG commit git
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8004
      # Internal service names (Docker network)
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-agri_shrimp_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      IMAGE_SEARCH_URL: ${IMAGE_SEARCH_URL:-http://agrishrimp-ai-visual-search:5001}
      AI_BASE_URL: ${AI_BASE_URL:-http://agrishrimp-ai-diagnosis:8000}
      # Force schema auto-update on startup to avoid validate crash during rollout
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Public URLs
      APP_CORS_ALLOWED_ORIGINS: https://agrishrimp.io.vn
      APP_WEB_BASE_URL: https://agrishrimp.io.vn
      APP_SERVER_URL: https://api.agrishrimp.io.vn
      APP_COOKIE_SECURE: "true"
      PAYOS_RETURN_URL: https://agrishrimp.io.vn/order-success
      PAYOS_CANCEL_URL: https://agrishrimp.io.vn/order-cancel
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-visual-search:
        condition: service_started
      ai-diagnosis:
        condition: service_started  # không block nếu AI chậm khởi động
    networks:
      - agrishrimp-net
    healthcheck:
      test: ["CMD-SHELL",
             "wget -qO- http://localhost:8004/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────
  # FRONTEND — Next.js 15 (Standalone)
  # Port 3004 — expose ra host, Nginx proxy từ agrishrimp.io.vn
  # ─────────────────────────────────────────────────────
  webapp:
    image: ghcr.io/z-oneteam-datn/agrishrimp-fe-react:latest
    container_name: agrishrimp-webapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"    # bind localhost only — Nginx sẽ proxy
    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_* đã bake vào image lúc build — chỉ cần server-side vars
      JAVA_API_URL: http://api:8004/api     # SSR gọi backend qua Docker network
      NEXT_SERVER_APP_URL: http://webapp:3004
      GHN_TOKEN: ${GHN_TOKEN}
      PORT: 3004
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_started
    networks:
      - agrishrimp-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3004 | head -c1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────────────
  # AI DIAGNOSIS — FastAPI + YOLOv8 + Gemini (INTERNAL ONLY)
  # Port 8000 — không expose ra ngoài, chỉ api gọi nội bộ
  # ─────────────────────────────────────────────────────
  ai-diagnosis:
    image: ghcr.io/z-oneteam-datn/agrishrimp-ai-diagnosis:latest
    container_name: agrishrimp-ai-diagnosis
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      PORT: 8000
    networks:
      - agrishrimp-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s    # YOLOv8 model cần thời gian load lần đầu

# ─────────────────────────────────────────────────────
# EXCLUDED SERVICES — do NOT uncomment until ready
# ─────────────────────────────────────────────────────
# minizalo:        ❌ excluded — pending Zalo platform approval

networks:
  agrishrimp-net:
    name: agrishrimp-net
    driver: bridge

volumes:
  mysql_data:
    name: agrishrimp_mysql_data
  redis_data:
    name: agrishrimp_redis_data
  clip_model_cache:
    name: agrishrimp_clip_cache
